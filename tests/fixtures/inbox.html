<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Faux Gmail — boîte de réception</title>
<style>
  body { margin: 0; font: 14px Arial, sans-serif; background: #f6f8fc; color: #202124; }
  .G-atb { position: fixed; top: 0; left: 256px; right: 56px; height: 48px; background: #fff; display: flex; gap: 12px; align-items: center; justify-content: flex-end; padding: 0 16px; }
  .G-atb [role=button] { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
  .G-atb [aria-disabled=true] { opacity: .4; }
  .Tm.aeJ { position: fixed; top: 48px; left: 256px; right: 56px; bottom: 0; overflow-y: auto; background: #fff; }
  .Wg { padding: 12px 16px 4px; }
  .Wn { font-weight: bold; }
  table.F { width: 100%; table-layout: fixed; border-collapse: collapse; }
  tr.zA { height: 40px; box-shadow: inset 0 -1px 0 0 rgba(100,121,143,.12); cursor: pointer; }
  tr.zE { font-weight: bold; }
  td { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.xW { text-align: right; }
</style>
</head>
<body>
<div class="G-atb" gh="tm" id="toolbar">
  <span id="counter">1–10 sur 20</span>
  <div role="button" id="newer" aria-label="Plus récents" data-tooltip="Plus récents" aria-disabled="true">‹</div>
  <div role="button" id="older" aria-label="Plus anciens" data-tooltip="Plus anciens">›</div>
</div>
<div class="Tm aeJ" id="scroller">
  <div role="main">
    <div class="ae4" id="starred-section">
      <div class="Wg"><h3 class="Wr iR"><div class="Wn">Messages suivis</div></h3></div>
      <div id="section0"></div>
    </div>
    <div class="ae4" id="rest-section">
      <div class="Wg"><h3 class="Wr iR"><div class="Wn">Tout le reste</div></h3></div>
      <div id="section1"></div>
    </div>
    <div class="ae4 UI" id="section2"></div>
  </div>
</div>
<script>
(function () {
  const fmt = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const fmtShort = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' });
  const fmtTime = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const fmtNum = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  let seq = 0;

  function dateAt(daysAgo, hour) {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysAgo, hour, 5);
  }

  function shortText(d) {
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return fmtTime.format(d);
    if (d.getFullYear() === now.getFullYear()) return fmtShort.format(d);
    return fmtNum.format(d);
  }

  function makeRow(daysAgo, hour, subject, opts = {}) {
    const d = dateAt(daysAgo, hour);
    const tr = document.createElement('tr');
    tr.className = 'zA ' + (opts.unread ? 'zE' : 'yO');
    tr.id = ':r' + (seq++);
    tr.dataset.daysAgo = daysAgo;
    const title = opts.title || fmt.format(d);
    const star = opts.starred ? '<span class="T-KT" title="Suivi" aria-label="Suivi"></span>' : '<span class="aXw T-KT" title="Non suivi" aria-label="Non suivi"></span>';
    tr.innerHTML = `<td class="PF xY PE"></td>
      <td class="oZ-x3 xY aid"><div class="oZ-jc T-Jo J-J5-Ji" role="checkbox" aria-checked="false"></div></td>
      <td class="apU xY">${star}</td>
      <td class="WA xY"></td>
      <td class="yX xY"><div class="yW"><span class="zF" email="x@example.com" name="Expéditeur">Expéditeur</span></div></td>
      <td class="xY a4W"><div class="xS" role="link"><div class="xT"><div class="y6"><span>${subject}</span></div></div></div></td>
      <td class="yf xY">&nbsp;</td>
      <td class="xW xY"><span title="${title}" aria-label="${title}"><b>${shortText(d)}</b></span></td>`;
    return tr;
  }

  function makeTable(parent, rows) {
    const cp = document.createElement('div');
    cp.className = 'Cp';
    cp.innerHTML = `<div><table cellpadding="0" class="F cf zt"><colgroup>
      <col class="Ci"><col class="y5"><col class="oZ-x3"><col class="apU"><col class="WA"><col class="yY"><col><col class="yg"><col class="xX">
      </colgroup><tbody></tbody></table></div>`;
    const tbody = cp.querySelector('tbody');
    rows.forEach((r) => tbody.appendChild(r));
    parent.appendChild(cp);
    return tbody;
  }

  makeTable(document.getElementById('section0'), [
    makeRow(0, 9, 'Suivi aujourd\'hui', { starred: true }),
    makeRow(3, 9, 'Suivi il y a 3 jours', { starred: true }),
    makeRow(30, 9, 'Suivi ancien', { starred: true }),
  ]);

  function page1() {
    return [
      makeRow(5, 9, 'E-mail remis en avant (en attente)'),
      makeRow(0, 11, 'Devis atelier', { unread: true }),
      makeRow(0, 8, 'Réunion de chantier'),
      makeRow(1, 17, 'Commande bois'),
      makeRow(2, 10, 'Plans BEAR Rennes'),
      makeRow(3, 15, 'Facture'),
      makeRow(8, 9, 'Livraison'),
      makeRow(20, 9, 'Newsletter'),
      makeRow(40, 9, 'Ancien devis'),
      makeRow(400, 9, 'Très ancien', { title: 'Thu, Oct 2, 2025 at 9:05 AM' }),
    ];
  }

  function page2() {
    return [410, 420, 430, 440, 450, 460, 470, 480, 490, 500].map((n) => makeRow(n, 9, 'Page 2 — ' + n + ' jours'));
  }

  const main = makeTable(document.getElementById('section1'), page1());
  makeTable(document.getElementById('section2'), [
    makeRow(0, 7, 'Section 2 — aujourd\'hui'),
    makeRow(1, 7, 'Section 2 — hier'),
  ]);

  // Pagination de Gmail : les boutons changent l'adresse (#inbox/p2), puis la liste est remplacée.
  const params = new URLSearchParams(location.search);
  if (params.has('nolabels')) {
    for (const id of ['older', 'newer']) {
      const b = document.getElementById(id);
      b.removeAttribute('aria-label');
      b.removeAttribute('data-tooltip');
    }
  }
  function render() {
    const n = /\/p2$/.test(location.hash) ? 2 : 1;
    if (n === window.__fake.page) return;
    main.replaceChildren(...(n === 2 ? page2() : page1()));
    document.getElementById('older').setAttribute('aria-disabled', String(n === 2));
    document.getElementById('newer').setAttribute('aria-disabled', String(n === 1));
    document.getElementById('counter').textContent = n === 2 ? '11–20 sur 20' : '1–10 sur 20';
    document.getElementById('scroller').scrollTop = 0;
    window.__fake.page = n;
  }
  window.addEventListener('hashchange', () => setTimeout(render, 150));
  document.getElementById('older').addEventListener('click', (e) => {
    if (e.currentTarget.getAttribute('aria-disabled') !== 'true') location.hash = '#inbox/p2';
  });
  document.getElementById('newer').addEventListener('click', (e) => {
    if (e.currentTarget.getAttribute('aria-disabled') !== 'true') location.hash = '#inbox';
  });

  window.__fake = {
    page: 1,
    addNewMail() {
      main.insertBefore(makeRow(0, 23, 'Nouveau message', { unread: true }), main.firstChild);
    },
    removeRow(daysAgo) {
      const r = main.querySelector(`tr[data-days-ago="${daysAgo}"]`);
      if (r) r.remove();
    },
  };
})();
</script>
</body>
</html>
